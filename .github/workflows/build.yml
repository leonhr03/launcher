name: APK bauen

permissions:
  contents: write

on:
  push:
    paths-ignore:
      - 'screenshots/**'
      - 'download/**'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: APK bauen
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: CleanLauncher-apk
          path: app/build/outputs/apk/release/*.apk

      - name: APK ins Repo legen (download/CleanLauncher.apk)
        run: |
          mkdir -p download
          cp app/build/outputs/apk/release/app-release.apk download/CleanLauncher.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add download/CleanLauncher.apk
          git commit -m "APK aktualisieren [skip ci]" || exit 0
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
